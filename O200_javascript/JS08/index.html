<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS08</title>
    <style>
        .cub {
        height: 80px;
        width: 80px;
        transition: 1s;
        position: relative;
        transform-style: preserve-3d;
        }

        .cara{
        width: 80px;
        height: 80px;
        font-size: 80px;
        text-align: center;
        line-height: 80px;
        margin: auto;
        position: absolute;
        top: 0;
        left: 0;
        }

        .blava {
        background: skyblue;
        transform-origin: left;
        transform: translateZ(-80px);
        }

        .groga {
        background: yellow;
        transform-origin: bottom;
        transform: rotateX(90deg);

        }

        .vermella {
        background: tomato;
        transform-origin: left;
        transform: rotateY(90deg);
        }
        .rosa {
        background: pink;
        transform-origin: right;
        transform: rotateY(-90deg);

        }

        .lila {
        background: violet;
        transform-origin: top;
        transform: rotateX(-90deg);
        }

        .verda {
        background: greenyellow;
        transform: rotateX(0deg);
        }

        .contenidor {
        margin: 10rem auto;
        width: 80px;
        height: 80px;
        -webkit-perspective: 160px;
        perspective: 160px;
        }

        .cub:hover {
        transform: rotateX(180deg) rotateZ(45deg);
        }

        .joystick {
            position: relative;
            background: pink;
            height: 12rem;
            width: 12rem;
            margin: auto;
        }

        .amunt {
            width: 4rem;
            height: 4rem;
            background: black;
            margin: auto;

        }

        .avall {
            width: 4rem;
            height: 4rem;
            background: red;
            margin: auto;
        }

        .esquerra {
            width: 4rem;
            height: 4rem;
            background: blue;
            float: left;
        }

        .dreta {
            width: 4rem;
            height: 4rem;
            background: green;
            float: right;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="contenidor">
        <div class="cub">
          <div class="cara blava">A</div>
          <div class="cara groga">B</div>
          <div class="cara vermella">C</div>
          <div class="cara rosa">D</div>
          <div class="cara lila">E</div>
          <div class="cara verda">F</div>
        </div>
    </div>

    <div class="joystick">
        <div class="boto amunt"></div>
        <div class="boto dreta"></div>
        <div class="boto esquerra"></div>
        <div class="boto avall"></div>
    </div>
</body>
</html>
